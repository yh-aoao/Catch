# experiment name. defaults to name of training config
experiment: ''
# seed - set to -1 to choose random seed
seed: 123
# set to True for deterministic performance
torch_deterministic: True
## Device config
rl_device: ???
device_id: 0  # 'cuda:?', -1 for 'cpu'

# Disables viewer or camera visualization
viewer: False
imshow_cam: False
# RL Arguments
test: False # False, True
task: Tracking # Catching_TwoStage, Catching_OneStage, Tracking
num_envs: 32 # This should be no more than 2x your CPUs (1x is recommended)
object_eval: False
# used to set checkpoint path
checkpoint_tracking: ''
checkpoint_catching: ''

# wandb config
output_name: Dcmm
wandb_mode: "disabled"  # "online" | "offline" | "disabled"
wandb_entity: 'Your_username'
# wandb_project: 'RL_Dcmm_Track_Random'
wandb_project: 'RL_Dcmm_Catch_Random'

# set default task and default training config based on task
defaults:
  - train: DcmmPPO
  - hydra/job_logging: disabled

# set the directory where the output files get saved
hydra:
  output_subdir: null
  run:
    dir: .

object_motion: "throw"

# Bounce uses the frozen 61709fc environment, config and PPO implementation.
# Only legacy is accepted while reproducing this baseline; P/L overrides error.
bounce_physics: "legacy"
bounce_launch: "legacy"
bounce_log: False        # print baseline identity; no later outcome diagnostics
basket_log: False        # print parking error, speed, reward terms and terminal reason
basket_freeze_tracking: True # TwoStage basket: preserve pretrained parking actor and normalization
roll_log: False          # print whole-hand clearance, waiting target and valid interception

# catch→throw 顺序任务专用 checkpoint（catch_throw_demo.py 使用）
catch_tracking: ''
catch_catching: ''
basket_tracking: ''
